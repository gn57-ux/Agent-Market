[project]
name = "dispatch-rerank"
version = "0.1.0"
description = "Feature 19 (ctr-online-learning), T-1910/T-1911: FastAPI + LangGraph reranking service, called only by Node (apps/api), never by Go."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<0.116.0",
  "uvicorn[standard]>=0.30.0,<0.31.0",
  "pydantic>=2.9.0,<3.0.0",
  "langgraph>=1.2.11",
  "httpx>=0.27.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "httpx>=0.27.0,<0.28.0",
  "ruff>=0.6.0,<0.7.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
filterwarnings = [
  # A pydantic-core/FastAPI interaction under Python 3.11 emits this
  # warning only during the actual HTTP request-parsing code path (not on
  # direct model construction, verified manually) even though every
  # camelCase alias in models.py round-trips correctly — confirmed by
  # test_main.py's own request/response assertions. Tracked as a known,
  # non-functional upstream quirk rather than a real bug in this service's
  # own code.
  "ignore:The 'alias' attribute with value.*:UserWarning",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
