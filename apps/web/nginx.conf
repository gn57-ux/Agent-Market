# T-2302: SPA fallback (react-router uses client-side routing — a direct
# request for e.g. /tasks/123 must serve index.html, not 404).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    return 200 "ok";
    add_header Content-Type text/plain;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
